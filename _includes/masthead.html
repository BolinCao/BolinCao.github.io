<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% if page.lang == 'zh-CN' %}
            {% assign nav_links = site.data.navigation.main_zh %}
            <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/zh/">学术主页</a></li>
          {% else %}
            {% assign nav_links = site.data.navigation.main_en %}
            <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/">Academic Homepage</a></li>
          {% endif %}
          {% for link in nav_links %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
